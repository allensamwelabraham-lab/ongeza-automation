[pytest]
testpaths = tests
addopts = -ra
markers =
    jumla: tests za JUMLA (https://jumla.ongeza.net)
    ongeza: tests za ONGEZA staging (https://staging.ongeza.net)
    ongezapro: tests za ONGEZA PRO (https://ongezapro.ongeza.net)
    smoke: kufungua module na kuhakikisha ukurasa unaload bila error
    forms: kufungua form ya Add na kujaribu validation bila kusave
    crud: tests zinazounda data (AUTO-...). Zinaendeshwa tu RUN_CRUD=1
    buttons: kubofya kila button ya kila module. Zinaendeshwa tu RUN_BUTTONS=1 (--buttons)
